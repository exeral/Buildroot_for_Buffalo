name: build-ts-xl
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: actions/checkout@v4
        with:
          repository: 1000001101000/Buildroot_for_Buffalo
          ref: 9ce7481640dfc0b54b20c504d389562fd79b2385
          path: src

      - uses: actions/cache@v4
        with:
          path: src/dl
          key: br-dl-${{ github.run_id }}
          restore-keys: br-dl-

      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib g++-multilib git wget cpio unzip rsync bc \
            file patch gawk perl bzip2 lzip zstd libncurses-dev libssl-dev python3 gdisk u-boot-tools \
            device-tree-compiler mtools uuid-runtime e2fsprogs kmod xz-utils libelf-dev flex bison

      - name: Buildroot 2025.08.1
        working-directory: src
        run: |
          wget -q https://buildroot.org/downloads/buildroot-2025.08.1.tar.xz
          tar xf buildroot-2025.08.1.tar.xz

      - name: Files expected by repo scripts
        env:
          SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
        run: |
          test -n "$SSH_PUBKEY" || { echo "secret SSH_PUBKEY manquant"; exit 1; }
          mkdir -p ~/.ssh ~/buildroot_keep
          echo "$SSH_PUBKEY" > ~/.ssh/id_rsa.pub
          cd ~/buildroot_keep
          for f in .msmtprc zed-config exports mdadm.conf rsyncd.conf rsyncd.secrets aliases; do : > "$f"; done
          echo "# m h dom mon dow command" > root

      - name: Generate config
        working-directory: src/buildroot-2025.08.1
        run: |
          cat > ../kernel/marvellv5/extra_configs <<'EOF'
          CONFIG_EXT4_FS=y
          CONFIG_XFS_FS=m
          CONFIG_BTRFS_FS=m
          CONFIG_FUSE_FS=m
          CONFIG_NTFS3_FS=m
          CONFIG_BLK_DEV_DM=m
          CONFIG_DM_SNAPSHOT=m
          CONFIG_DM_MIRROR=m
          CONFIG_DM_THIN_PROVISIONING=m
          CONFIG_PACKET=m
          CONFIG_IPV6=y
          CONFIG_NFSD=m
          CONFIG_NFSD_V3_ACL=y
          CONFIG_NFSD_V4=y
          EOF
          printf 'CONFIG_VI=y\n' > ../custom/busybox_extra.fragment

          cat > br2.frag <<'EOF'
          BR2_LINUX_KERNEL_INTREE_DTS_NAME="mv78100-terastation-tsxl"
          BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES="../kernel/debug_configs ../kernel/docker_configs ../kernel/general_hardware_configs ../kernel/iscsi_configs ../kernel/mdadm_configs ../kernel/r8152_configs ../kernel/marvellv5/custom_configs ../kernel/marvellv5/extra_configs"
          BR2_PACKAGE_BUSYBOX_CONFIG_FRAGMENT_FILES="../custom/busybox_extra.fragment"
          BR2_PACKAGE_IPUTILS=y
          BR2_PACKAGE_IPUTILS_PING=y
          BR2_PACKAGE_TCPDUMP=y
          BR2_PACKAGE_BIND=y
          BR2_PACKAGE_BIND_TOOLS=y
          BR2_PACKAGE_IPERF3=y
          BR2_PACKAGE_NTFS_3G=y
          BR2_PACKAGE_NTFS_3G_NTFSPROGS=y
          BR2_PACKAGE_VSFTPD=y
          BR2_PACKAGE_LFTP=y
          BR2_PACKAGE_LFTP_PROTO_FTP=y
          BR2_PACKAGE_LFTP_PROTO_HTTP=y
          BR2_PACKAGE_LFTP_PROTO_SFTP=y
          BR2_PACKAGE_NET_TOOLS=y
          EOF
          printf 'BR2_PACKAGE_ZFS\n' > br2.unset

          cp ../configs/marvellv5_defconfig .config
          for s in $(sed -E 's/=.*//' br2.frag) $(cat br2.unset); do
            sed -i -E "/^(# )?${s}(=| is not set)/d" .config
          done
          cat br2.frag >> .config
          make olddefconfig

          miss=0
          while IFS= read -r l; do
            grep -qxF "$l" .config || { echo "ABSENT: $l"; miss=1; }
          done < br2.frag
          exit $miss

      - name: Build (1st make stops by design, see common_prebuild.sh)
        working-directory: src/buildroot-2025.08.1
        run: |
          yes '' | make -j"$(nproc)" || true
          make -j"$(nproc)"

      - name: Verify kernel, binaries, services
        continue-on-error: true
        working-directory: src/buildroot-2025.08.1
        run: |
          k=$(ls -d output/build/linux-6*/.config)
          for o in EXT4_FS XFS_FS BTRFS_FS FUSE_FS NTFS3_FS BLK_DEV_DM NFSD IPV6 PACKET LEDS_GPIO KEYBOARD_GPIO; do
            grep -E "^CONFIG_$o=[ym]" "$k" || echo "KERNEL ABSENT: $o"
          done
          for b in ping nc tcpdump ethtool nslookup iperf3 mdadm lvm xfs_repair btrfs mkfs.ext4 ntfs-3g exportfs rpcbind smbd vsftpd dropbear lftp curl wget scp rsync netstat top nano vi python3 bash crond hdparm smartctl lspci lsusb micro-evtd; do
            find output/target -name "$b" \( -type f -o -type l \) | grep -q . || echo "BINAIRE ABSENT: $b"
          done
          ls output/target/usr/lib/systemd/system | grep -Ei 'smb|vsftpd|dropbear|nfs|rpcbind|dcron|rsync' || true

      - name: Check boot constraints
        working-directory: src/buildroot-2025.08.1/output/images
        run: |
          ls -l uImage.buffalo initrd.buffalo boot.img disk.img
          k=$(stat -c %s uImage.buffalo); i=$(stat -c %s initrd.buffalo)
          [ "$k" -lt 6291456 ] || { echo "uImage > 6 MiB"; exit 1; }
          [ "$k" -lt 4718592 ] || echo "WARN: uImage > 4.5 MiB (connu OK: 4.1 MB)"
          [ "$i" -lt 15728640 ] || { echo "initrd > 15 MiB"; exit 1; }
          dumpe2fs -h boot.img 2>/dev/null | grep -E 'Inode size|features'
          debugfs -R "ls -l /" boot.img | grep -E 'uImage.buffalo|initrd.buffalo'
          sgdisk -p disk.img

      - name: Pack
        working-directory: src/buildroot-2025.08.1/output/images
        run: xz -T0 -k disk.img

      - uses: actions/upload-artifact@v4
        with:
          name: ts-xl-images
          path: |
            src/buildroot-2025.08.1/output/images/disk.img.xz
            src/buildroot-2025.08.1/output/images/uImage.buffalo
            src/buildroot-2025.08.1/output/images/initrd.buffalo
            src/buildroot-2025.08.1/output/images/*.dtb
